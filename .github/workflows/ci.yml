name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shared/pyproject.toml
      - run: pip install -e "shared[dev]"
      - run: ruff check shared services
      - run: ruff format --check shared services
      - run: cd shared && pytest -q
      - name: "Service tests (one process per service, each has an app package)"
        run: |
          for s in gateway ingestion block template report editor; do
            (cd services/$s && python -m pytest -q) || exit 1
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      matrix:
        service: [gateway, ingestion, block, template, report, editor]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/Dockerfile --build-arg SERVICE=${{ matrix.service }} .
