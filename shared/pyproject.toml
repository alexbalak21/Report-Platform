[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-shared"
version = "0.1.0"
description = "Shared library for the Report Platform services"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "gunicorn>=22.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "requests>=2.31",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "nh3>=0.2.17",
  "pydantic>=2.6",
  "alembic>=1.13",
  "tinycss2>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.21", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["rp_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
